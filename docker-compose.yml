version: '3.8'

services:
  # Database Layer: MongoDB with Persistent Volume
  mongodb:
    image: mongo:7.0-jammy
    container_name: gramroute-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: gramroute_ai
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gramroute-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Optimization & Analytics Microservice: Python Google OR-Tools
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: gramroute-ai-engine
    restart: always
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    networks:
      - gramroute-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Core Business Logic & WebSocket Gateway: Node.js Express TypeScript
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gramroute-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/gramroute_ai
      - AI_ENGINE_URL=http://ai-engine:8000
      - JWT_ACCESS_SECRET=production_strong_jwt_access_secret_gramroute_2026_xyz
      - JWT_REFRESH_SECRET=production_strong_jwt_refresh_secret_gramroute_2026_xyz
      - COOKIE_SECRET=production_cookie_signature_secret_gramroute_2026
      - CORS_ORIGIN=http://localhost,http://localhost:5173
    ports:
      - "5000:5000"
    networks:
      - gramroute-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Single Page Application: React Vite via Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gramroute-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - gramroute-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local

networks:
  gramroute-network:
    driver: bridge
